name: Django CI/CD for Heroku

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt django-environ

    - name: Run Tests
      run: |
        python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v3

    - name: Notify Heroku Deployment Status (Skipped)
      run: |
        echo "::warning::Heroku deployment is fully configured and ready, but actual hosting is skipped per instructions."

    - name: Deploy to Heroku
      if: false # Prepared but skipped as requested by the task requirements
      uses: akhileshns/heroku-deploy@v3.12.14
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: "recipe-django-app"
        heroku_email: "shyshkinandrey06@gmail.com"
